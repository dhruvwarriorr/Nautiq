name: Platform checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - run: make setup
      - name: Install locked offline scientific test dependencies
        run: make phase0-setup
      - name: Check generated contract reproducibility
        run: git diff --exit-code -- services/api/gen ml/nautiuq_ml/gen
      - run: make lint
      - run: make test
      - name: Verify offline Argo normalization contracts
        run: make phase2-verify
      - name: Verify frozen scientific fixtures and training policy
        run: make phase3-verify
      - run: make build
      - name: Start isolated persistence for reproducibility checks
        run: docker compose up -d --wait postgres minio nats
      - run: make migrate
      - run: docker compose up --build -d normalizer
      - name: Verify revision recovery and frozen snapshot integrity
        run: make phase2-reliability phase3-reliability
      - name: Stop verification infrastructure
        if: always()
        run: docker compose down --remove-orphans
