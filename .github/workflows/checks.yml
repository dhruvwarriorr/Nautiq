name: Platform checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - run: make setup
      - name: Install locked offline scientific test dependencies
        run: make phase0-setup uncertainty-setup fields-setup operations-setup
      - name: Check generated contract reproducibility
        run: git diff --exit-code -- services/api/gen ml/nautiq_ml/gen
      - run: make lint
      - run: make test
      - name: Verify offline Argo normalization contracts
        run: make phase2-verify
      - name: Verify frozen scientific fixtures and training policy
        run: make phase3-verify phase4-verify phase5-verify phase6-verify phase7-verify phase8-verify phase9-verify phase10-verify phase11-verify phase12-verify phase13-verify phase14-verify
      - run: make build
      - name: Start isolated persistence for reproducibility checks
        run: docker compose up -d --wait postgres minio nats
      - run: make migrate
      - run: docker compose up --build -d normalizer ml-inference mlflow field-service
      - run: docker compose build event-worker advisory-worker trip-verifier product-verifier export-worker notification-verifier operations-verifier operations-tools api web notifications
      - name: Verify revision recovery and frozen snapshot integrity
        run: make phase2-reliability phase3-reliability phase4-reliability phase5-reliability phase6-reliability phase7-reliability phase8-reliability phase9-reliability phase10-reliability phase11-reliability phase12-reliability phase13-reliability phase14-reliability
      - name: Verify disposable HTTPS deployment
        run: make phase14-production
      - name: Stop verification infrastructure
        if: always()
        run: docker compose down --remove-orphans
