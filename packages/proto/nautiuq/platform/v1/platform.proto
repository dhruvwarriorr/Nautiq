syntax = "proto3";
package nautiuq.platform.v1;
option go_package = "nautiuq.local/api/gen/nautiuq/platform/v1;platformv1";
// Runtime readiness remains independent of explicitly loaded scientific releases.
service PlatformService {
  rpc Check(CheckRequest) returns (CheckResponse);
}
message CheckRequest {}
message CheckResponse {
  string service = 1;
  string version = 2;
  bool ready = 3;
  // Runtime responsiveness and loaded scientific capabilities are independent.
  map<string, bool> capabilities = 4;
  string expected_release_id = 5;
  string expected_bundle_sha256 = 6;
}

// A request is bound to an explicit immutable release, never a registry alias.
service ExpectedStateService {
  rpc Infer(ExpectedStateRequest) returns (ExpectedStateResponse);
}
message ReferencePoint {
  double latitude = 1;
  double longitude = 2;
  double depth_m = 3;
  string observed_at = 4;
}
message ExpectedStateRequest {
  string release_id = 1;
  repeated ReferencePoint points = 2;
  bool explain = 3;
}
message FeatureContribution {
  string feature = 1;
  double contribution = 2;
}
message ExpectedPrediction {
  optional double climatology_mean = 1;
  optional double candidate_mean = 2;
  optional double candidate_residual = 3;
  optional double expected_mean = 4;
  optional double ml_residual = 5;
  string active_method = 6;
  string reason = 7;
  string candidate_reason = 8;
  repeated string promotion_reasons = 9;
  repeated FeatureContribution feature_contributions = 10;
  optional double contribution_bias = 11;
  bytes baseline_support_json = 12;
}
message DepthPrediction {
  double depth_m = 1;
  ExpectedPrediction temperature_c = 2;
  ExpectedPrediction practical_salinity = 3;
}
message ExpectedStateResponse {
  string release_id = 1;
  string bundle_sha256 = 2;
  string method_version = 3;
  string feature_version = 4;
  string estimand = 5;
  repeated DepthPrediction rows = 6;
  bool release_approved = 7;
  string interval_status = 8;
  string explanation_interpretation = 9;
}
