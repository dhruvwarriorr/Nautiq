# Optional authenticated SMTP; use after the production overlay, never as a default.
services:
  api:
    environment: &mail
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_MODE: ${SMTP_MODE:-starttls}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
      SMTP_USERNAME: ''
      SMTP_USERNAME_FILE: /run/secrets/smtp_username
      SMTP_PASSWORD: ''
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    secrets: [smtp_username, smtp_password]
  notifications:
    environment: *mail
    secrets: [smtp_username, smtp_password]
secrets:
  smtp_username: {file: '${NAUTIQ_SECRETS_DIR}/smtp_username'}
  smtp_password: {file: '${NAUTIQ_SECRETS_DIR}/smtp_password'}
