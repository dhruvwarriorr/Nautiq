name: nautiq
services:
  postgres:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nautiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nautiq_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-nautiq}
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - ./migrations/001_platform.sql:/docker-entrypoint-initdb.d/001_platform.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  nats:
    image: nats:2.11-alpine
    command: [-js, -sd, /data, -m, '8222']
    volumes: [nats_data:/data]
  minio:
    build: {context: ., dockerfile: infrastructure/minio/Dockerfile, target: server}
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nautiq_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nautiq_local_storage}
    volumes: [minio_data:/data]
    ports: ['127.0.0.1:9001:9001']
  storage-init:
    build: {context: ., dockerfile: infrastructure/minio/Dockerfile, target: client}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nautiq_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nautiq_local_storage}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        attempts=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          attempts=$$((attempts + 1))
          [ "$$attempts" -lt 60 ] || exit 1
          sleep 2
        done
        mc mb --ignore-existing local/nautiq
    depends_on: [minio]
  ml-inference:
    build: {context: ., dockerfile: ml/Expected.Dockerfile}
    environment:
      SERVICE_NAME: ml-inference
      DATABASE_URL: postgres://${POSTGRES_USER:-nautiq}:${POSTGRES_PASSWORD:-nautiq_local_dev}@postgres:5432/${POSTGRES_DB:-nautiq}?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nautiq_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nautiq_local_storage}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ML_RELEASE_ID: ${ML_RELEASE_ID:-}
      UNCERTAINTY_RELEASE_ID: ${UNCERTAINTY_RELEASE_ID:-}
      ANOMALY_RELEASE_ID: ${ANOMALY_RELEASE_ID:-}
      SOURCE_GIT_COMMIT: ${SOURCE_GIT_COMMIT:-unavailable}
    mem_limit: 2g
    cpus: 1
    read_only: true
    tmpfs: ['/tmp:size=512m,mode=1777']
    depends_on:
      postgres: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
  mlflow:
    build: {context: ., dockerfile: ml/Expected.Dockerfile}
    command: [mlflow, server, --workers, '1', --backend-store-uri, 'sqlite:////tracking/mlflow.db', --artifacts-destination, '/tracking/artifacts', --host, '0.0.0.0', --port, '5000', --allowed-hosts, 'mlflow:5000,localhost:${MLFLOW_PORT:-5001},127.0.0.1:${MLFLOW_PORT:-5001}']
    volumes: [mlflow_data:/tracking]
    ports: ['127.0.0.1:${MLFLOW_PORT:-5001}:5000']
    mem_limit: 1g
  field-service:
    build: {context: ., dockerfile: ml/Fields.Dockerfile}
    environment: &field_environment
      DATABASE_URL: postgres://${POSTGRES_USER:-nautiq}:${POSTGRES_PASSWORD:-nautiq_local_dev}@postgres:5432/${POSTGRES_DB:-nautiq}?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nautiq_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nautiq_local_storage}
      SOURCE_GIT_COMMIT: ${SOURCE_GIT_COMMIT:-unavailable}
    depends_on:
      postgres: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
    read_only: true
    tmpfs: ['/tmp:size=256m,mode=1777']
    mem_limit: 1g
    cpus: 1
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  field-ingestion:
    build: {context: ., dockerfile: ml/Fields.Dockerfile}
    environment: *field_environment
    command: [python, -m, nautiq_ml.fields.pipeline, refresh, --watch]
    depends_on:
      postgres: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
    profiles: [fields-live]
    read_only: true
    tmpfs: ['/tmp:size=256m,mode=1777']
    mem_limit: 1g
    cpus: 1
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  ingestion:
    build: {context: ., dockerfile: services/ingestion/Dockerfile}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nautiq}:${POSTGRES_PASSWORD:-nautiq_local_dev}@postgres:5432/${POSTGRES_DB:-nautiq}?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nautiq_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nautiq_local_storage}
      NATS_URL: nats://nats:4222
      ARGO_OBSERVED_SINCE: ${ARGO_OBSERVED_SINCE:-2025-10-01T00:00:00Z}
    depends_on:
      postgres: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
      nats: {condition: service_started}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
  normalizer:
    build: {context: ., dockerfile: ml/Argo.Dockerfile}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nautiq}:${POSTGRES_PASSWORD:-nautiq_local_dev}@postgres:5432/${POSTGRES_DB:-nautiq}?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nautiq_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nautiq_local_storage}
      NATS_URL: nats://nats:4222
    depends_on:
      postgres: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
      nats: {condition: service_started}
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:size=256m,mode=1777']
    mem_limit: 1g
    cpus: 1
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  api:
    build: {context: ., dockerfile: services/api/Dockerfile}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nautiq}:${POSTGRES_PASSWORD:-nautiq_local_dev}@postgres:5432/${POSTGRES_DB:-nautiq}?sslmode=disable
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nautiq_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nautiq_local_storage}
      ML_GRPC_ADDR: ml-inference:50051
      FIELD_GRPC_ADDR: field-service:50051
    ports: ['127.0.0.1:${API_PORT:-8080}:8080']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
      nats: {condition: service_started}
      ml-inference: {condition: service_started}
      field-service: {condition: service_started}
  web:
    build: {context: ., dockerfile: apps/web/Dockerfile}
    environment: {API_INTERNAL_URL: 'http://api:8080'}
    ports: ['127.0.0.1:${WEB_PORT:-3000}:3000']
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
  minio_data:
  nats_data:
  mlflow_data:
